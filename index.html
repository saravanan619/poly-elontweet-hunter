<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elon Musk Polymarket Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
                Elon Musk Polymarket Tweet Tracker
            </h1>
            <p class="text-slate-400 mt-2">Real-time keyword resolution for active bets</p>
            <div class="inline-block mt-4 px-4 py-1.5 bg-slate-800 rounded-full text-xs text-slate-400 border border-slate-700">
                Last Scraped: <span id="last-updated" class="font-mono text-cyan-400">Loading...</span>
            </div>
        </header>
        <div id="tracker-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </div>
    <script>
        async function loadTrackerData() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                document.getElementById('last-updated').innerText = data.last_updated;
                const grid = document.getElementById('tracker-grid');
                grid.innerHTML = '';
                Object.entries(data.targets).forEach(([keyword, info]) => {
                    const isHit = info.status === 'HIT';
                    const card = document.createElement('div');
                    card.className = `p-6 rounded-2xl border transition-all duration-300 bg-slate-800/50 ${isHit ? 'border-emerald-500/30 hover:border-emerald-500/50' : 'border-slate-700/50 hover:border-slate-600'}`;
                    let tweetsHtml = '';
                    if (isHit) {
                        tweetsHtml = `
                            <div class="mt-4 pt-4 border-t border-slate-700/50">
                                <p class="text-xs text-slate-500 uppercase tracking-wider font-semibold mb-2">Matching Tweets:</p>
                                ${info.matching_tweets.map(t => `
                                    <div class="text-sm text-slate-300 italic bg-slate-900/60 p-3 rounded-lg border border-slate-800 mb-2">
                                        "${t.text}"
                                        <div class="text-[10px] text-slate-500 mt-1 font-mono">${t.created_at}</div>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    }
                    card.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="text-xl font-bold tracking-wide">${keyword}</span>
                            <span class="px-3 py-1 text-xs font-bold uppercase tracking-widest rounded-full ${isHit ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-700 text-slate-400'}">
                                ${info.status}
                            </span>
                        </div>
                        <div class="text-sm text-slate-400 mt-2">
                            Occurrences found: <span class="font-mono font-bold ${isHit ? 'text-emerald-400' : 'text-slate-400'}">${info.count}</span>
                        </div>
                        ${tweetsHtml}
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error('Error fetching tracker data:', err);
            }
        }
        loadTrackerData();
    </script>
</body>
</html>
